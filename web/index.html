<!DOCTYPE html>
<html lang="zh-CN" data-mode="auto" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Juen's</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23141c24' width='32' height='32'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='18' fill='%23dbe4eb' font-family='Didot,serif' font-style='italic'%3EJ%3C/text%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        var mode = localStorage.getItem("juens-theme") || "auto";
        document.documentElement.dataset.mode = mode;
        if (mode === "day") document.documentElement.dataset.theme = "light";
        else if (mode === "night") document.documentElement.dataset.theme = "dark";
        else {
          var last = localStorage.getItem("juens-theme-auto");
          if (last === "dark" || last === "light") document.documentElement.dataset.theme = last;
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <h1>Juen's</h1>
    <div class="tools">
      <button type="button" id="theme-btn" class="theme-btn" aria-label="切换显示模式">自动</button>
      <p id="count">—</p>
    </div>
  </header>
  <main>
    <p id="note" class="note" hidden></p>
    <div id="grid" class="grid"></div>
  </main>
  <div id="lightbox" class="lb" hidden>
    <div class="lb-stage" id="lb-stage">
      <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="上一张">‹</button>
      <img id="lb-img" alt="">
      <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="下一张">›</button>
      <p id="lb-cap"></p>
    </div>
    <aside class="lb-meta" id="lb-meta">
      <h2>信息</h2>
      <dl>
        <div><dt>文件名</dt><dd data-k="name"></dd></div>
        <div><dt>格式</dt><dd data-k="format"></dd></div>
        <div><dt>大小</dt><dd data-k="size"></dd></div>
        <div><dt>分辨率</dt><dd data-k="res"></dd></div>
        <div><dt>像素</dt><dd data-k="px"></dd></div>
        <div><dt>存储空间</dt><dd data-k="disk"></dd></div>
      </dl>
    </aside>
    <button type="button" class="lb-meta-toggle" id="lb-meta-toggle" aria-expanded="false" aria-controls="lb-meta">信息</button>
  </div>
  <noscript>打开相册需要浏览器启用 JavaScript。</noscript>
  <script src="/app.js" defer></script>
</body>
</html>
