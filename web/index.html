<!DOCTYPE html>
<html lang="zh-CN" data-mode="auto" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Juen's</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect rx='9' fill='%2318151d' width='32' height='32'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='18' fill='%23f0a6bd' font-family='cursive'%3EJ%3C/text%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        var mode = localStorage.getItem("juens-theme") || "auto";
        document.documentElement.dataset.mode = mode;
        if (mode === "day") document.documentElement.dataset.theme = "light";
        else if (mode === "night") document.documentElement.dataset.theme = "dark";
        else {
          var last = localStorage.getItem("juens-theme-auto");
          if (last === "dark" || last === "light") document.documentElement.dataset.theme = last;
        }
        var sidebar = localStorage.getItem("juens-sidebar");
        if (sidebar !== "expanded" && sidebar !== "collapsed") {
          sidebar = window.matchMedia("(max-width: 719px)").matches ? "collapsed" : "expanded";
        }
        document.documentElement.dataset.sidebar = sidebar;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <button type="button" id="nav-scrim" class="nav-scrim" aria-label="收起导航"></button>
  <aside id="sidebar" class="sidebar" aria-label="图库导航">
    <div class="sidebar-head">
      <a class="brand" href="/" aria-label="Juen's 照片">
        <span class="brand-full">Juen's</span>
        <span class="brand-short" aria-hidden="true">J</span>
      </a>
      <button type="button" id="sidebar-toggle" class="icon-btn sidebar-toggle" aria-expanded="true" aria-controls="sidebar" aria-label="收起导航" title="收起导航">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <path d="M9 3v18"></path>
          <path class="sidebar-arrow" d="m15 9-3 3 3 3"></path>
        </svg>
        <span class="sr-only">收起导航</span>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a id="nav-photos" class="nav-item" href="/" title="照片">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3"></rect>
          <circle cx="9" cy="9" r="1.5"></circle>
          <path d="m4 17 4.4-4.4a2 2 0 0 1 2.8 0l1.6 1.6 1.4-1.4a2 2 0 0 1 2.8 0l3 3"></path>
        </svg>
        <span>照片</span>
      </a>
      <a id="nav-albums" class="nav-item" href="/?view=albums" title="相册">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="5" width="15" height="15" rx="3"></rect>
          <path d="M4 16H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v1"></path>
          <circle cx="10" cy="10" r="1.3"></circle>
          <path d="m6 17 3.4-3.4a2 2 0 0 1 2.8 0L14 15.4l1-1a2 2 0 0 1 2.8 0L20 16.6"></path>
        </svg>
        <span>相册</span>
      </a>
    </nav>
    <p class="sidebar-foot"><span>本地图库</span></p>
  </aside>

  <div class="app-main">
    <header class="top">
      <div class="page-heading">
        <a id="album-back" class="icon-btn album-back" href="/?view=albums" aria-label="返回相册" title="返回相册" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        </a>
        <div>
          <p id="page-context" class="page-context">图库</p>
          <h1 id="page-title">照片</h1>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="theme-btn" class="icon-btn theme-btn" aria-label="显示模式：自动；点击切换" title="显示模式：自动；点击切换">
          <svg class="theme-icon theme-icon-auto" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none" opacity=".24"></path>
            <path d="M12 3v18"></path>
          </svg>
          <svg class="theme-icon theme-icon-night" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 13.2A8.6 8.6 0 1 1 10.8 3a6.7 6.7 0 0 0 10 10.2Z"></path>
          </svg>
          <svg class="theme-icon theme-icon-day" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.6"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
          </svg>
          <span class="sr-only">自动</span>
        </button>
        <p id="count">—</p>
      </div>
    </header>
    <main>
      <p id="note" class="note" hidden></p>
      <div id="album-grid" class="album-grid" hidden></div>
      <div id="grid" class="grid"></div>
    </main>
  </div>
  <div id="lightbox" class="lb" hidden>
    <div class="lb-stage" id="lb-stage">
      <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="上一张">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <img id="lb-img" alt="">
      <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="下一张">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
      <p id="lb-cap" class="lb-cap"></p>
    </div>
    <aside class="lb-meta" id="lb-meta">
      <h2>信息</h2>
      <dl>
        <div><dt>文件名</dt><dd data-k="name"></dd></div>
        <div><dt>格式</dt><dd data-k="format"></dd></div>
        <div><dt>大小</dt><dd data-k="size"></dd></div>
        <div><dt>分辨率</dt><dd data-k="res"></dd></div>
        <div><dt>像素</dt><dd data-k="px"></dd></div>
        <div><dt>存储空间</dt><dd data-k="disk"></dd></div>
      </dl>
    </aside>
    <button type="button" class="icon-btn lb-meta-toggle" id="lb-meta-toggle" aria-expanded="false" aria-controls="lb-meta" aria-label="显示信息" title="显示信息">
      <svg class="meta-icon meta-icon-info" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 11v5"></path>
        <path d="M12 8h.01"></path>
      </svg>
      <svg class="meta-icon meta-icon-close" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
        <path d="M15 3v18M7 9l3 3-3 3"></path>
      </svg>
      <span class="sr-only">信息</span>
    </button>
  </div>
  <noscript>打开相册需要浏览器启用 JavaScript。</noscript>
  <script src="/app.js" defer></script>
</body>
</html>
